# StanzaWeaver Docker Compose
#
# Default: port mapping (STANZAWEAVER_HOST=0.0.0.0).
# Alternative: use --network host on Linux (the service then binds 127.0.0.1,
#       which matches the "local access only" security design; drop the ports section).
#
# Start:  docker compose up -d --build
# Open:   http://localhost:5000
# Logs:   docker compose logs -f stanzaweaver
# Stop:   docker compose down

services:
  stanzaweaver:
    build: .
    image: stanzaweaver:latest
    container_name: stanzaweaver
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      STANZAWEAVER_HOST: "0.0.0.0"
      STANZAWEAVER_PORT: "5000"
      # STANZAWEAVER_LOG_DIR points inside the volume so logs persist
      STANZAWEAVER_LOG_DIR: "/home/stanzaweaver/.stanza_weaver/logs"
    volumes:
      # Persistence: config / lexicon / history / logs
      - stanzaweaver-data:/home/stanzaweaver/.stanza_weaver
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/import-status', timeout=5)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  stanzaweaver-data:
