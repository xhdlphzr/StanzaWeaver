# StanzaWeaver CI/CD
#
# CI  (持续集成): 每次 push / PR 在 ubuntu-latest 上运行（按规范顺序）
#   - uv lock --check           依赖锁一致性
#   - reuse lint                REUSE 许可证合规
#   - pytest -q --cov=src --cov=app --cov-report=term-missing --cov-fail-under=100
#                               （单测+集成，桩 LLM 无网络；强制 src + app.py 覆盖率 100%）
#   - ruff check ./             静态检查
#   - mypy --strict ./          类型检查（零容忍）
#   - ruff format --check ./    代码格式
#
# CD  (持续交付): Release 发布时触发，三平台打包并上传分卷 zip 到 Release 附件
#   - Windows : uv run pyinstaller StanzaWeaver.spec --clean -> zip -s 1g 分卷
#   - macOS   : uv run pyinstaller StanzaWeaver.spec --clean -> zip -s 1g 分卷
#   - Linux   : uv run pyinstaller StanzaWeaver.spec --clean -> zip -s 1g 分卷
#
# 注: Python 版本统一由仓库根目录 .python-version（3.14）决定，uv 会自动安装/使用。

name: CI/CD

# 同一分支/PR 的新提交会取消仍在运行的旧流水线，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # CI: 代码层持续集成（代码无关平台，统一在 ubuntu-latest 上一次跑完）
  #   顺序: uv lock --check -> reuse lint -> pytest(coverage) -> ruff check
  #         -> mypy --strict -> ruff format --check
  # ------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: uv lock check
        run: uv lock --check

      - name: REUSE compliance
        run: uv run reuse lint

      - name: "pytest (coverage: src + app)"
        run: uv run pytest

      - name: ruff check
        run: uv run ruff check ./

      - name: mypy (strict)
        run: uv run mypy --strict ./

      - name: ruff format --check
        run: uv run ruff format --check ./

  # ------------------------------------------------------------------
  # CD: Release 发布时触发，测试通过后跨平台打包并上传分卷 zip
  # ------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    needs: ci
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install dependencies (incl. dev: pyinstaller)"
        run: uv sync --frozen

      - name: Install zip (Windows)
        if: runner.os == 'Windows'
        run: choco install zip -y

      - name: Install zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zip

      # ---------- Windows / macOS / Linux: PyInstaller 出包（onedir 目录） ----------
      - name: Build with PyInstaller
        run: uv run pyinstaller StanzaWeaver.spec --clean

      # ---------- 分卷压缩（统一 zip -s 1g） ----------
      - name: Compress into 1GB volumes
        run: cd dist && zip -s 1g -r StanzaWeaver-${{ runner.os }}.zip StanzaWeaver/

      # ---------- 上传到 Release 附件 ----------
      - name: Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/StanzaWeaver-${{ runner.os }}.z* --repo "${{ github.repository }}" --clobber
