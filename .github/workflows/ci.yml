# StanzaWeaver CI/CD
#
# CI  (持续集成): 每次 push / PR 在三个平台运行
#   - ruff format ./           代码格式化
#   - ruff check --fix --unsafe-fixes ./   静态检查与自动修复
#   - mypy --strict ./         类型检查（零容忍）
#   - pytest                   单元测试 + 集成测试（桩 LLM，无网络）
#
# CD  (持续交付): CI 全部通过后，仅对主分支打包，产物上传为 artifact
#   - Windows : pyinstaller StanzaWeaver.spec --clean        -> StanzaWeaver.exe
#   - macOS   : pyinstaller StanzaWeaver.spec --clean        -> StanzaWeaver (单文件)
#
# 注: 本地 venv 与 Dockerfile 均使用 Python 3.14，故 CI 统一锁定 3.14。

name: CI/CD

# 同一分支/PR 的新提交会取消仍在运行的旧流水线，节省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # CI: 两个平台并行执行 lint / 类型检查 / 测试
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # CI: 代码层持续集成（代码无关平台，统一在 ubuntu 上一次跑完）
  #   - ruff check ./            静态检查（不自动修改）
  #   - mypy --strict ./         类型检查（零容忍）
  #   - pytest                   单元测试 + 集成测试（桩 LLM，无网络）
  # ------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ruff check
        run: ruff check ./

      - name: mypy (strict)
        run: mypy --strict ./

      - name: pytest
        run: pytest

  # ------------------------------------------------------------------
  # CD: 仅主分支，测试通过后跨平台打包（matrix.os）
  # ------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    needs: ci
    # 仅主分支触发打包（PR 不发布产物）
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ---------- Windows / macOS: PyInstaller 直接出包 ----------
      - name: Build with PyInstaller (Windows/macOS)
        run: pyinstaller StanzaWeaver.spec --clean

      # ---------- 上传产物（分别命名以便后续发布） ----------
      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: StanzaWeaver-Windows.exe
          path: dist/StanzaWeaver.exe
          if-no-files-found: error

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: StanzaWeaver-macOS
          path: dist/StanzaWeaver
          if-no-files-found: error