# StanzaWeaver CI/CD
#
# CI  (Continuous Integration): runs on ubuntu-latest for every push / PR
#   - uv lock --check           dependency lock consistency
#   - reuse lint                REUSE license compliance
#   - pytest -q --cov=src --cov=app --cov-report=term-missing --cov-fail-under=100
#                               (unit + integration, stubbed LLM without network;
#                               enforces 100% coverage of src + app.py)
#   - ruff check ./             static analysis
#   - mypy --strict ./          type checking (zero tolerance)
#   - ruff check --select D ./  Google-style docstring check
#   - ruff format --check ./    code formatting
#
# CD  (Continuous Delivery): triggered on Release; packages on three platforms
#     and uploads split zips to the Release assets
#   - Windows : uv run pyinstaller StanzaWeaver.spec --clean -> zip -s 1g split archive
#   - macOS   : uv run pyinstaller StanzaWeaver.spec --clean -> zip -s 1g split archive
#   - Linux   : uv run pyinstaller StanzaWeaver.spec --clean -> zip -s 1g split archive
#
# Note: the Python version is pinned by .python-version at the repo root;
# uv installs and uses it automatically.

name: CI/CD

# New commits on the same branch/PR cancel still-running pipelines to save resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # CI: code-level continuous integration
  #     (platform-agnostic, runs once on ubuntu-latest)
  #   Order: uv lock --check -> reuse lint -> pytest(coverage) -> ruff check
  #          -> mypy --strict -> ruff format --check
  # ------------------------------------------------------------------
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: uv lock check
        run: uv lock --check

      - name: REUSE compliance
        run: uv run reuse lint

      - name: "pytest (coverage: src + app)"
        run: uv run pytest

      - name: ruff check
        run: uv run ruff check ./

      - name: mypy (strict)
        run: uv run mypy --strict ./

      - name: ruff docstring (D)
        run: uv run ruff check --select D ./

      - name: ruff format --check
        run: uv run ruff format --check ./

  # ------------------------------------------------------------------
  # CD: triggered on Release; after tests pass, package across platforms and
  #     upload split zips
  # ------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    needs: ci
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install dependencies (incl. dev: pyinstaller)"
        run: uv sync --frozen

      - name: Install zip (Windows)
        if: runner.os == 'Windows'
        run: choco install zip -y

      - name: Install zip (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zip

      # ---------- Windows / macOS / Linux: PyInstaller build (onedir) ----------
      - name: Build with PyInstaller
        run: uv run pyinstaller StanzaWeaver.spec --clean

      # ---------- Split compression (uniform zip -s 1g) ----------
      - name: Compress into 1GB volumes
        run: cd dist && zip -s 1g -r StanzaWeaver-${{ runner.os }}.zip StanzaWeaver/

      # ---------- Upload to Release assets ----------
      - name: Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/StanzaWeaver-${{ runner.os }}.z* --repo "${{ github.repository }}" --clobber
