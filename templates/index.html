<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StanzaWeaver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=JetBrains+Mono:ital,wght@0,400;0,500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
    />
    <link rel="stylesheet" href="/static/style.css" />
    <script>
      var I18N = {};
      var CURRENT_LANG = "en";
      function t(key, args) {
        var parts = key.split(".");
        var val = I18N;
        for (var i = 0; i < parts.length; i++) {
          if (val === undefined || val === null) return key;
          val = val[parts[i]];
        }
        if (val === undefined || val === null) return key;
        if (args) {
          Object.keys(args).forEach(function (k) {
            val = val.replace(new RegExp("\\{" + k + "\\}", "g"), args[k]);
          });
        }
        return val;
      }
      function applyI18N() {
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var v = t(el.getAttribute("data-i18n"));
          if (v !== el.getAttribute("data-i18n")) el.textContent = v;
        });
        document
          .querySelectorAll("[data-i18n-placeholder]")
          .forEach(function (el) {
            var v = t(el.getAttribute("data-i18n-placeholder"));
            if (v !== el.getAttribute("data-i18n-placeholder"))
              el.placeholder = v;
          });
        document.querySelectorAll("[data-i18n-title]").forEach(function (el) {
          var v = t(el.getAttribute("data-i18n-title"));
          if (v !== el.getAttribute("data-i18n-title")) el.title = v;
        });
        document.documentElement.lang = t("html.lang");
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="import-overlay" class="import-overlay">
        <div class="import-overlay-content">
          <div class="import-spinner"></div>
          <p data-i18n="import_overlay">导入词库中，请稍候...</p>
        </div>
      </div>
      <header>
        <div class="header-logo">
          <h1>StanzaWeaver</h1>
          <p class="slogan" data-i18n="header.slogan">以智识，巧织诗</p>
        </div>
        <div class="header-right">
          <button
            id="btn-ping"
            class="btn-ping"
            data-i18n-title="header.ping_title"
            title="检查连接"
          >
            &#8635;
          </button>
          <span class="ai-status-label">AI</span>
          <span id="llm-status-dot" class="llm-dot"></span>
          <span id="llm-status-text" class="llm-status-text"></span>
          <button
            id="btn-history"
            class="btn-icon"
            data-i18n-title="poem.history_title"
            title="历史记录"
          >
            &#128220;
          </button>
          <button
            id="btn-config"
            class="btn-icon"
            data-i18n-title="header.config_title"
            title="LLM配置"

            &#9881;
          </button>
        </div>
      </header>

      <main>
        <section class="input-section">
          <div class="field">
            <label data-i18n="topic.label">主题</label>
            <textarea
              id="topic"
              data-i18n-placeholder="topic.placeholder"
              placeholder="输入你想写的诗歌主题...也可以粘贴一首诗让AI帮忙修改"
            ></textarea>
          </div>
          <div class="field field-inline">
            <label data-i18n="mode.label">模式</label>
            <select id="mode-select">
              <option value="single" data-i18n="mode.single">单首</option>
              <option value="sequence" data-i18n="mode.sequence">诗组</option>
            </select>
          </div>
          <div class="field field-inline" id="template-field">
            <label data-i18n="template.label">格律</label>
            <select id="template-select">
              <option value="" data-i18n="template.default_option">

            </select>
            <button

              class="btn-secondary btn-small"
              data-i18n="template.custom"
            >
              + 自定义

            <button
              id="btn-manage-templates"
              class="btn-secondary btn-small"
              data-i18n="template.manage"
              data-i18n-title="template.manage_title"

            </button>
          </div>
          <div id="sequence-config" class="hidden">
            <div class="field field-inline">
              <label data-i18n="sequence.count_label">诗数</label>

                class="sequence-count"
                type="number"

                value="3"
              />
              <label data-i18n="sequence.meter_mode_label">格律</label>
              <select id="sequence-meter-mode">
                <option value="uniform" data-i18n="sequence.meter_uniform">

              </select>
            </div>
            <div class="field field-inline" id="sequence-uniform-field">
              <label data-i18n="sequence.uniform_label">统一格律</label>
              <select id="sequence-uniform-template"></select>
            </div>
            <div class="field hidden" id="sequence-per-field">
              <label data-i18n="sequence.per_label">逐首格律</label>
              <div id="sequence-per-list" class="sequence-per-list"></div>
            </div>
          </div>
          <div class="actions">
            <button
              id="btn-generate"
              class="btn-primary"
              disabled
              data-i18n="generate.button"
            >
              开始生成
            </button>
          </div>
        </section>

        <section id="progress-section" class="hidden card">
          <div class="section-header" data-i18n="progress.title">生成进度</div>
          <div id="progress-list"></div>
        </section>

        <section id="sequence-section" class="hidden card">
          <div class="section-header" data-i18n="sequence.progress_title">
            诗组进度
          </div>
          <div id="sequence-plan" class="sequence-plan"></div>
          <div id="sequence-poems-status" class="sequence-poems-status"></div>
        </section>

        <section id="poem-section" class="hidden card">
          <div class="section-header-row">
            <span class="section-header" data-i18n="poem.title">诗稿</span>
            <button
              id="btn-copy"
              class="btn-copy"
              data-i18n-title="poem.copy_title"
              title="复制诗稿"
            >
              &#128203;
            </button>
          </div>
          <div id="poem-display"></div>
          <div id="checker-inline" class="checker-inline hidden"></div>
          <div id="tool-status" class="tool-status hidden"></div>
        </section>

        <section id="feedback-section" class="hidden card">
          <div class="feedback-buttons">
            <button
              id="btn-accept"
              class="btn-accept"
              data-i18n="review.accept"
            >
              定稿
            </button>
            <button
              id="btn-reject"
              class="btn-reject"
              data-i18n="review.reject"
            >
              不定稿
            </button>
          </div>
          <div id="feedback-input-area" class="hidden">
            <div class="field">
              <input
                type="text"
                id="user-feedback"
                data-i18n-placeholder="feedback.placeholder"
                placeholder="输入修改意见..."
              />
            </div>
            <button
              id="btn-feedback"
              class="btn-send"
              disabled
              data-i18n="feedback.button"
            >

            </button>
          </div>
        </section>
      </main>
    </div>

        <div class="config-group">

        </div>
        <div class="config-group">

          <label>Base URL <input type="text" id="cfg-checker-url" /></label>
          <label>API Key <input type="password" id="cfg-checker-key" /></label>
          <label>Model <input type="text" id="cfg-checker-model" /></label>
        </div>
        <div class="config-group">
          <h3 data-i18n="config_modal.editor">模板AI</h3>
          <label>Base URL <input type="text" id="cfg-editor-url" /></label>
          <label>API Key <input type="password" id="cfg-editor-key" /></label>
          <label>Model <input type="text" id="cfg-editor-model" /></label>
        </div>
        <div class="modal-actions">
          <button

      </div>

    <div id="history-modal" class="modal hidden">
      <div class="modal-content modal-wide">
        <h2 data-i18n="history_modal.title">历史记录</h2>
        <div id="history-list" class="history-list"></div>
        <div class="modal-actions">
          <button

            class="btn-secondary"
            data-i18n="history_modal.close"

          </button>
        </div>

    </div>

    <div id="template-modal" class="modal hidden">
      <div class="modal-content modal-wide">
        <h2 data-i18n="template_modal.title">自定义格律模板</h2>
        <div class="config-group">
          <label
            ><span data-i18n="template_modal.name_label">模板名称</span>
            <input

              data-i18n-placeholder="template_modal.name_placeholder"
              placeholder="如：浣溪沙"

        </div>
        <div class="config-group config-row">
          <label
            ><span data-i18n="template_modal.language_label">语言</span>
            <select id="tmpl-language">
              <option value="zh" data-i18n="template_modal.lang_zh">

              <option value="en" data-i18n="template_modal.lang_en">

              <option value="fr" data-i18n="template_modal.lang_fr">
                法语
              </option>
              <option value="it" data-i18n="template_modal.lang_it">
                意大利语

              <option value="la" data-i18n="template_modal.lang_la">
                古典拉丁语

          </label>
          <label

          <label

              min="1"
              max="8"

          <label
            ><span data-i18n="template_modal.syllables_label">每行音节</span>
            <input
              type="text"
              id="tmpl-syl-per-line"
              value="7,7,7,7"
              data-i18n-placeholder="template_modal.syllables_placeholder"
              placeholder="逗号分隔"
          /></label>
        </div>
        <div class="config-group">
          <label
            ><span data-i18n="template_modal.convert_label"
              >从其它模板转化</span
            >
            <select id="tmpl-base-template">
              <option value="" data-i18n="template_modal.convert_none">
                -- 不转换 --
              </option>
            </select>
          </label>
          <div id="tmpl-conversion" class="tmpl-conversion hidden">
            <div id="tmpl-convert-mapping" class="tmpl-convert-mapping"></div>
            <label class="checkbox-label ai-rewrite-code-label">
              <input type="checkbox" id="tmpl-ai-rewrite-code" />
              <span data-i18n="template_modal.convert_ai_code_label"
                >通过 AI 转写原模板代码（按目标语言重写校验逻辑）</span

            <p class="rhyme-hint" data-i18n="template_modal.convert_ai_code_hint">

              请生成模板后人工检查 AI 代码。
            </p>
            <button
              type="button"
              id="btn-apply-convert"
              class="btn-secondary btn-small"
              data-i18n="template_modal.convert_apply"
            >
              应用转换
            </button>
            <div id="tmpl-convert-report" class="convert-report hidden"></div>
          </div>
        </div>
        <div class="config-group">
          <div
            class="section-header"
            style="margin-top: 8px"
            data-i18n="template_modal.constraints_title"
          >
            每行音节约束
          </div>
          <div id="tmpl-syllable-table" class="syllable-alternatives"></div>
        </div>
        <div class="config-group">
          <div
            class="section-header"
            style="margin-top: 8px"
            data-i18n="template_modal.rhyme_title"
          >
            押韵
          </div>
          <label>
            <input
              type="text"
              id="tmpl-rhyme-scheme"
              data-i18n-placeholder="template_modal.rhyme_scheme_placeholder"
              placeholder="如 ABAB CDCD EFEF GG，- 表示不押韵"
            />
          </label>
          <p class="rhyme-hint" data-i18n="template_modal.rhyme_scheme_hint">
            用字母标记每行的韵脚，相同字母押同一个韵；-、. 或 x
            表示该行不押韵。
          </p>
          <label class="checkbox-label">
            <input type="checkbox" id="tmpl-rhyme-distinct" />
            <span data-i18n="template_modal.rhyme_distinct_label"
              >不同韵脚必须互不相同（如商籁体 A/B 韵不同）</span
            >
          </label>
          <div id="tmpl-rhyme-lines" class="rhyme-lines"></div>
        </div>
        <div class="config-group">
          <label
            for="tmpl-rule-note"
            data-i18n="template_modal.rule_note_label"
            >模板规则描述（会作为 prompt 提供给生成 AI）</label
          >
          <textarea
            id="tmpl-rule-note"
            class="rule-note-input"
            rows="3"
            data-i18n-placeholder="template_modal.rule_note_placeholder"
            placeholder="例如：模仿某词牌，上下片需情景相生，注意领字与对仗……"
          ></textarea>
          <p class="rhyme-hint" data-i18n="template_modal.rule_note_hint">
            这段描述会随模板保存，并在生成诗歌时作为格律要求提示发给写作 AI。
          </p>
        </div>
        <div class="config-group">
          <label data-i18n="template_modal.custom_code_label"
            >自定义检测代码（Python，可选）</label
          >
          <div id="tmpl-code" class="code-editor"></div>
        </div>
        <div class="config-group">
          <div id="tmpl-ai-panel" class="tmpl-ai-panel">
            <div class="tmpl-ai-header">
              <span
                class="tmpl-ai-title"
                data-i18n="template_modal.ai_title"
                >模板AI</span
              >
              <span id="tmpl-ai-status" class="tmpl-ai-status"></span>
            </div>
            <div id="tmpl-ai-log" class="tmpl-ai-log"></div>
            <div class="tmpl-ai-input-row">
              <textarea
                id="tmpl-ai-input"
                data-i18n-placeholder="template_modal.ai_placeholder"
                placeholder="描述你想要的模板，AI 会调用工具配置它…"
              ></textarea>
              <button
                type="button"
                id="btn-tmpl-ai-send"
                class="btn-secondary btn-small"
                data-i18n="template_modal.ai_send"
              >
                发送
              </button>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button
            id="btn-create-template"
            class="btn-primary"
            data-i18n="template_modal.create"
          >
            生成模板
          </button>
          <button
            id="btn-close-template"
            class="btn-secondary"
            data-i18n="template_modal.cancel"
          >
            取消
          </button>
        </div>
      </div>
    </div>

    <div id="template-manage-modal" class="modal hidden">
      <div class="modal-content modal-wide">
        <h2 data-i18n="template_manage.title">模板管理</h2>
        <p class="rhyme-hint" data-i18n="template_manage.hint">
          按住模板行上下拖动可调整顺序；删除仅对自定义模板可用。
        </p>
        <div id="template-manage-list" class="template-manage-list"></div>
        <div class="modal-actions">
          <button
            id="btn-reset-order"
            class="btn-secondary"
            data-i18n="template_manage.reset"
          >
            重置顺序
          </button>
          <button
            id="btn-close-manage"
            class="btn-secondary"
            data-i18n="template_manage.close"
          >
            关闭
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script>
      const socket = io();
      const CSRF_TOKEN = "{{ csrf_token }}";
      function csrfHeaders() {
        return { "X-CSRF-Token": CSRF_TOKEN };
      }
      let isGenerating = false;
      let llmDisabled = true;
      let llmConnected = false;
      let lastPoem = [];
      let lastFormatted = "";
      let currentStep = "";
      let TEMPLATES = [];
      var manageDragKey = null;
      var STEP_NAMES = {
        1: "生成描述",
        2: "生成初稿",
        3: "炼句优化",
        4: "终审",
      };
      const STEP_ORDER = [1, 2, 3, 4];

      function applyButtonStates() {
        var gen = document.getElementById("btn-generate");
        gen.disabled = llmDisabled || isGenerating;
        if (isGenerating) {
          gen.classList.add("is-loading");
          gen.textContent = t("generate.loading") || "生成中...";
        } else {
          gen.classList.remove("is-loading");
          gen.textContent = t("generate.button");
        }
        document.getElementById("btn-feedback").disabled = llmDisabled;
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetch("/api/config", { headers: csrfHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (cfg) {
            CURRENT_LANG = cfg.language || "zh";
            return fetch("/api/i18n/" + CURRENT_LANG);
          })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            I18N = data;
            STEP_NAMES[1] = t("steps.step1_description");
            STEP_NAMES[2] = t("steps.step2_draft");
            STEP_NAMES[3] = t("steps.step3_refine");
            STEP_NAMES[4] = t("steps.step4_check");
            applyI18N();
            loadTemplates();
          });

        document
          .getElementById("btn-generate")
          .addEventListener("click", startGenerate);
        document
          .getElementById("mode-select")
          .addEventListener("change", applyMode);
        document
          .getElementById("sequence-count")
          .addEventListener("change", rebuildSequenceMeters);
        document
          .getElementById("sequence-meter-mode")
          .addEventListener("change", applySequenceMeterMode);
        document
          .getElementById("btn-feedback")
          .addEventListener("click", sendFeedback);
        document
          .getElementById("btn-reject")
          .addEventListener("click", showFeedbackInput);
        document
          .getElementById("btn-accept")
          .addEventListener("click", acceptFinal);
        document
          .getElementById("btn-config")
          .addEventListener("click", openConfig);
        document
          .getElementById("btn-ping")
          .addEventListener("click", manualPing);
        document
          .getElementById("btn-close-config")
          .addEventListener("click", closeConfig);
        document
          .getElementById("btn-save-config")
          .addEventListener("click", saveConfig);
        document
          .getElementById("btn-custom-template")
          .addEventListener("click", openTemplateModal);
        document
          .getElementById("btn-manage-templates")
          .addEventListener("click", openTemplateManage);
        document
          .getElementById("btn-close-manage")
          .addEventListener("click", closeTemplateManage);
        document
          .getElementById("btn-reset-order")
          .addEventListener("click", resetTemplateOrder);
        var manageList = document.getElementById("template-manage-list");
        manageList.addEventListener("dragstart", function (e) {
          var target = e.target && e.target.closest
            ? e.target.closest(".template-manage-item")
            : null;
          if (!target) return;
          manageDragKey = target.dataset.key;
          target.classList.add("dragging");
          if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
        });
        manageList.addEventListener("dragend", function () {
          manageDragKey = null;
          manageList
            .querySelectorAll(".template-manage-item.dragging")
            .forEach(function (el) {
              el.classList.remove("dragging");
            });
        });
        manageList.addEventListener("dragover", function (e) {
          e.preventDefault();
          var dragging = manageList.querySelector(
            ".template-manage-item.dragging",
          );
          var target = e.target && e.target.closest
            ? e.target.closest(".template-manage-item")
            : null;
          if (!dragging || !target || target === dragging) return;
          var rect = target.getBoundingClientRect();
          moveManageItem(
            manageList,
            dragging,
            target,
            e.clientY < rect.top + rect.height / 2,
          );
        });
        manageList.addEventListener("drop", function (e) {
          e.preventDefault();
          if (manageDragKey) persistTemplateOrder();
        });
        document
          .getElementById("btn-create-template")
          .addEventListener("click", createTemplate);
        document
          .getElementById("btn-close-template")
          .addEventListener("click", closeTemplateModal);
        document.getElementById("btn-copy").addEventListener("click", copyPoem);
        document
          .getElementById("btn-history")
          .addEventListener("click", openHistory);
        document
          .getElementById("btn-close-history")
          .addEventListener("click", closeHistory);

        const topicEl = document.getElementById("topic");
        topicEl.addEventListener("input", function () {
          this.style.height = "0";

      // FLIP 动画：移动拖动行时让其它行平滑上/下移动，避免瞬间跳变。
      function moveManageItem(list, dragging, target, insertBefore) {
        var siblings = Array.prototype.filter.call(
          list.children,
          function (el) {
            return el !== dragging;
          },
        );
        var firstTops = siblings.map(function (el) {
          return el.getBoundingClientRect().top;
        });
        if (insertBefore) {
          list.insertBefore(dragging, target);
        } else {
          list.insertBefore(dragging, target.nextSibling);
        }
        siblings.forEach(function (el, index) {
          var lastTop = el.getBoundingClientRect().top;
          var delta = firstTops[index] - lastTop;
          if (!delta) return;
          el.style.transition = "none";
          el.style.transform = "translateY(" + delta + "px)";
          void el.offsetHeight;
          requestAnimationFrame(function () {
            el.style.transition = "transform 180ms ease";
            el.style.transform = "";
          });
        });
      }

      function updateLLMStatus(data) {
        var dot = document.getElementById("llm-status-dot");
        var text = document.getElementById("llm-status-text");
        var checking =
          data.writer === "checking" || data.checker === "checking";
        // 已连接成功时，重新检测不退回灰色，保持绿色直到结果覆盖
        if (checking && llmConnected) {
          return;
        }
        dot.className = "llm-dot";
        text.textContent = "";
        llmDisabled = true;
        if (data.writer === "error" || data.checker === "error") {
          llmConnected = false;
          dot.classList.add("llm-dot-error");
          text.textContent = t("status.connection_failed");
        } else if (data.writer === "ok" && data.checker === "ok") {
          llmConnected = true;
          dot.classList.add("llm-dot-ok");
          llmDisabled = false;
        } else if (checking) {
          dot.classList.add("llm-dot-checking");
        }

      function startGenerate() {
        const topic = document.getElementById("topic").value.trim();
        const mode = document.getElementById("mode-select").value;
        if (!topic) {
          showToast(t("toast.enter_topic"), "warning");
          return;
        }
        if (mode === "sequence") {
          const count = clampSequenceCount();
          const meterMode = document.getElementById("sequence-meter-mode").value;
          let templateKeys = [];
          if (meterMode === "uniform") {
            const uniformKey = document.getElementById(
              "sequence-uniform-template",
            ).value;
            if (!uniformKey) {
              showToast(t("toast.select_template"), "warning");
              return;
            }
            templateKeys = new Array(count).fill(uniformKey);
          } else {
            const selects = document.querySelectorAll(
              "#sequence-per-list .sequence-per-select",
            );
            selects.forEach(function (sel) {
              templateKeys.push(sel.value);
            });
            if (
              templateKeys.length !== count ||
              templateKeys.some(function (key) {
                return !key;
              })
            ) {
              showToast(t("toast.select_template"), "warning");
              return;
            }
          }
          isGenerating = true;
          applyButtonStates();
          document.getElementById("progress-section").classList.add("hidden");
          document.getElementById("poem-section").classList.add("hidden");
          document.getElementById("feedback-section").classList.add("hidden");
          document.getElementById("checker-inline").classList.add("hidden");
          document.getElementById("tool-status").classList.add("hidden");
          document.getElementById("sequence-section").classList.remove("hidden");
          document.getElementById("sequence-plan").textContent = "";
          document.getElementById("sequence-poems-status").innerHTML = "";
          document.getElementById("poem-display").innerHTML = "";
          lastPoem = [];
          lastFormatted = "";
          currentStep = "";
          renderedSeqs.clear();
          socket.emit("generate_sequence", {
            topic: topic,
            template_keys: templateKeys,
          });
          return;
        }
        const templateKey = getSelectedTemplate();
        if (!templateKey) {
          showToast(t("toast.select_template"), "warning");
          return;
        }

        isGenerating = true;
        applyButtonStates();
        document.getElementById("progress-section").classList.remove("hidden");
        document.getElementById("poem-section").classList.remove("hidden");
        document.getElementById("sequence-section").classList.add("hidden");

      function ensureStepItem(list, stepKey) {

      const renderedSeqs = new Set();

      function renderStepDetail(list, d) {
        if (d.seq !== undefined && renderedSeqs.has(d.seq)) return;
        const item = ensureStepItem(list, d.step);
        const title = item.querySelector(".step-title");
        if (d.rounds !== undefined) {
          title.textContent = (d.title || "") + " (" + d.rounds + ")";
        } else if (d.title) {
          title.textContent = d.title;
        }
        const body = item.querySelector(".progress-body");
        body
          .querySelectorAll(".step-record.pending")
          .forEach((el) => el.remove());
        const count =
          body.querySelectorAll(".step-record:not(.pending)").length + 1;
        const rec = document.createElement("div");
        rec.className = "step-record";
        if (d.content) {
          const label = document.createElement("div");
          label.className = "step-record-label";
          label.textContent =
            (d.title || "") + (count > 1 ? t("round", { count: count }) : "");
          rec.appendChild(label);
          const pre = document.createElement("pre");
          pre.textContent = d.content;
          rec.appendChild(pre);
        }
        body.appendChild(rec);
        if (d.seq !== undefined) renderedSeqs.add(d.seq);
      }

      function handleProgress(data) {
        const list = document.getElementById("progress-list");

        if (data.step !== currentStep) {
          const prevIdx = STEP_ORDER.indexOf(currentStep);
          const newIdx = STEP_ORDER.indexOf(data.step);
          const goingBack = prevIdx >= 0 && newIdx < prevIdx;
          if (prevIdx >= 0 && !goingBack) updateStepDot(currentStep, "done");
          if (goingBack) updateStepDot(currentStep, "failed");

          currentStep = data.step;

          for (let i = 0; i <= newIdx; i++) {
            ensureStepItem(list, STEP_ORDER[i]);
          }

          for (let i = 0; i < newIdx; i++) {
            updateStepDot(STEP_ORDER[i], "done");
          }
          updateStepDot(currentStep, "running");
        }

        if (data.step_details) {
          data.step_details.forEach((d) => {
            renderStepDetail(list, d);
            const item = ensureStepItem(list, d.step);
            const dot = item.querySelector(".step-dot");
            if (d.step === currentStep) {
              dot.className = "step-dot running";
            }
          });
        }

        if (data.stream_text) {
          const display = document.getElementById("poem-display");
          if (!data.draft || !data.draft.length) {
            display.innerHTML =
              '<div class="poem-line stream-text' +
              (data.centered === false ? " poem-left" : "") +
              '">' +
              escapeHtml(data.stream_text) +
              "</div>";
          }
        }
        if (
          data.formatted_poem ||
          data.title ||
          (data.draft && data.draft.length > 0)
        ) {
          renderPoemContent(
            document.getElementById("poem-display"),
            data.title,
            data.formatted_poem,
            data.draft,
            data.centered,
            false,
          );
        }

        if (data.last_tool) {
          const ts = document.getElementById("tool-status");
          ts.classList.remove("hidden");
          const toolNames = {
            search_words: t("tools.search_words"),
            modify: t("tools.modify"),
            submit: t("tools.submit"),
            _thinking: t("tools.thinking"),
          };
          ts.innerHTML =
            '<span class="tool-label">' +
            (toolNames[data.last_tool] || data.last_tool) +
            "</span>";
          if (data.last_tool_result) {
            ts.innerHTML +=
              '<span class="tool-result">' +
              escapeHtml(String(data.last_tool_result).substring(0, 200)) +
              "</span>";
          }
        }

        if (data.current_detail_step && data.current_detail) {
          const item = document.getElementById(
            "progress-" + data.current_detail_step,
          );
          if (item) {
            const body = item.querySelector(".progress-body");
            body
              .querySelectorAll(".step-record.pending")
              .forEach((el) => el.remove());
            const rec = document.createElement("div");
            rec.className = "step-record pending";
            const pre = document.createElement("pre");
            pre.textContent = data.current_detail;
            rec.appendChild(pre);
            body.appendChild(rec);
          }
        }
      }

      function createStepItem(stepKey, title) {
        const wrapper = document.createElement("div");
        wrapper.id = "progress-" + stepKey;
        wrapper.className = "progress-step";

        const header = document.createElement("div");
        header.className = "progress-header";
        header.innerHTML =
          '<span class="step-dot"></span><span class="step-title">' +
          title +
          '</span><span class="step-caret">&#9660;</span>';

        const body = document.createElement("div");
        body.className = "progress-body";

        header.addEventListener("click", () => {
          body.classList.toggle("collapsed");
          const caret = header.querySelector(".step-caret");
          caret.innerHTML = body.classList.contains("collapsed")
            ? "&#9654;"
            : "&#9660;";
        });

        wrapper.appendChild(header);
        wrapper.appendChild(body);
        return wrapper;
      }

      // ---- 统一的诗稿渲染（诗稿进行中 / 最终展示 / 诗组共用） ----

      // 格式化文本首行通常就是标题；把它拆出来单独用标题样式渲染。
      function splitFormattedTitle(text, title) {
        var content = typeof text === "string" ? text : "";
        var expected = typeof title === "string" ? title.trim() : "";
        if (!content) return { title: expected, body: "" };
        var newline = content.indexOf("\n");
        var firstLine = (newline >= 0 ? content.slice(0, newline) : content).trim();
        if (expected && firstLine === expected) {
          return {
            title: expected,
            body: newline >= 0 ? content.slice(newline + 1) : "",
          };
        }
        return { title: expected, body: content };
      }

      function stripTitleFromLines(lines, title) {
        var list = Array.isArray(lines) ? lines.slice() : [];
        var expected = typeof title === "string" ? title.trim() : "";
        if (expected && list.length && String(list[0]).trim() === expected) {
          list.shift();
        }
        return list;
      }

      function buildPoemTitle(title, centered) {
        var el = document.createElement("div");
        el.className = "poem-title" + (centered === false ? " poem-left" : "");
        el.textContent = title;
        return el;
      }

      function buildPoemBody(text, centered) {
        var pre = document.createElement("pre");
        pre.className =
          "poem-formatted" + (centered === false ? " poem-left" : "");
        pre.textContent = text;
        return pre;
      }

      // 把“加粗放大的标题 + 诗体正文”渲染进容器；相同内容不重复渲染以免闪动。
      // force=true 用于最终定稿（即使内容相同也强制刷新一次）。
      function renderPoemContent(
        container,
        title,
        formattedText,
        fallbackLines,
        centered,
        force,
      ) {
        if (!container) return;
        var parts = splitFormattedTitle(formattedText, title);
        var displayTitle = parts.title || "";
        var body = parts.body;
        if (!body) {
          body = stripTitleFromLines(fallbackLines, displayTitle).join("\n");
        }
        if (!displayTitle && !body) return;
        var key = [displayTitle, body, centered === false ? "1" : "0"].join(
          "\u0000",
        );
        if (
          !force &&
          key === container.dataset.poemRenderKey &&
          container.innerHTML !== "" &&
          !container.querySelector(".stream-text")
        ) {
          return;
        }
        container.dataset.poemRenderKey = key;
        container.innerHTML = "";
        if (displayTitle) {
          container.appendChild(buildPoemTitle(displayTitle, centered));
        }
        if (body) container.appendChild(buildPoemBody(body, centered));
      }

      function handleDone(data) {
        isGenerating = false;
        applyButtonStates();

        const poem = data.final_poem || data.draft || [];
        const display = document.getElementById("poem-display");
        lastPoem = [...poem];
        lastFormatted = data.formatted_poem || "";
        // 最终展示与诗稿进行中完全同一套渲染（标题加粗放大）。
        renderPoemContent(
          display,
          data.title,
          data.formatted_poem,
          poem,
          data.centered,
          true,
        );

        document.getElementById("tool-status").classList.add("hidden");

        const checkerInline = document.getElementById("checker-inline");
        checkerInline.classList.remove("hidden");
        if (data.checker_pass) {
          checkerInline.innerHTML =
            '<div class="checker-pass">&#10004; ' +
            t("checker.pass") +
            "</div>";
        } else {
          checkerInline.innerHTML =
            '<div class="checker-fail">&#10008; ' +
            t("checker.fail") +
            "</div>";
          if (data.checker_suggestions) {
            checkerInline.innerHTML +=
              '<div class="checker-detail">' +
              escapeHtml(data.checker_suggestions) +
              "</div>";
          }
        }

        if (data.step_details) {
          const list = document.getElementById("progress-list");
          data.step_details.forEach((d) => {
            renderStepDetail(list, d);
          });
          if (data.checker_pass) {
            STEP_ORDER.forEach((k) => updateStepDot(k, "done"));
          } else {
            STEP_ORDER.forEach((k) => updateStepDot(k, "done"));
            updateStepDot(4, "failed");
          }
        }

        document.getElementById("feedback-section").classList.remove("hidden");
        document.getElementById("feedback-input-area").classList.add("hidden");
        document.getElementById("user-feedback").value = "";

        if (data.checker_pass) {
          const poemText = data.formatted_poem || poem.join("\n");
          const topic = document.getElementById("topic").value;
          const tmplName =
            document.getElementById("template-select").selectedOptions[0]
              .textContent;
          fetch("/api/history", {
            method: "POST",
            headers: Object.assign(
              { "Content-Type": "application/json" },
              csrfHeaders(),
            ),
            body: JSON.stringify({
              topic: topic,
              template_name: tmplName,
              poem: poemText,
            }),
          });
        }
      }

      function renderSequencePoems(data) {
        const display = document.getElementById("poem-display");
        display.innerHTML = "";
        delete display.dataset.poemRenderKey;
        display.appendChild(
          buildPoemTitle("\u300a" + (data.title || "") + "\u300b", true),
        );
        (data.poems || []).forEach(function (p) {
          const wrap = document.createElement("div");
          wrap.className = "sequence-poem";
          const poemTitle = p.title || p.planned_title || "";
          const parts = splitFormattedTitle(p.formatted_poem, poemTitle);
          if (poemTitle) {
            wrap.appendChild(
              buildPoemTitle("\u300a" + poemTitle + "\u300b", p.centered),
            );
          }
          let body = parts.body;
          if (!body) {
            body = stripTitleFromLines(p.draft, poemTitle).join("\n");
          }
          wrap.appendChild(buildPoemBody(body || "\u2026", p.centered));
          const status = document.createElement("div");
          status.className = p.checker_pass ? "sequence-poem-ok" : "sequence-poem-bad";
          if (p.done) {
            status.textContent = p.checker_pass
              ? t("checker.pass")
              : t("checker.fail");
          }
          wrap.appendChild(status);
          display.appendChild(wrap);
        });
      }

      function handleSequenceProgress(data) {
        document.getElementById("sequence-section").classList.remove("hidden");
        document.getElementById("sequence-plan").textContent = data.plan_text || "";
        const list = document.getElementById("sequence-poems-status");
        list.innerHTML = "";
        (data.poems || []).forEach(function (p, i) {
          const row = document.createElement("div");
          row.className = "sequence-poem-status";
          let flag = "\u00b7";
          if (p.done) flag = p.checker_pass ? "\u2714" : "\u2718";
          else if (i === data.current_index) flag = "\u2026";
          row.innerHTML =
            '<span class="sequence-poem-index">' +
            (i + 1) +
            '</span><span class="sequence-poem-name">\u300a' +
            escapeHtml(p.title || p.planned_title || "") +
            '\u300b</span><span class="sequence-poem-tpl">' +
            escapeHtml(p.template_key || "") +
            '</span><span class="sequence-poem-flag">' +
            flag +
            "</span>";
          list.appendChild(row);
        });
        if (data.poems && data.poems.length) {
          document.getElementById("poem-section").classList.remove("hidden");
          renderSequencePoems(data);
        }
      }

      function handleSequenceDone(data) {
        isGenerating = false;
        applyButtonStates();
        document.getElementById("sequence-section").classList.add("hidden");
        document.getElementById("poem-section").classList.remove("hidden");

      function copyPoem() {
        var parts = [];
        var sequencePoems = document.querySelectorAll(".sequence-poem");
        if (sequencePoems.length) {
          var sequenceTitle = document.querySelector("#poem-display > .poem-title");
          if (sequenceTitle) parts.push(sequenceTitle.textContent);
          sequencePoems.forEach(function (item) {
            var name = item.querySelector(".poem-title");
            var pre = item.querySelector(".poem-formatted");
            if (name) parts.push(name.textContent);
            if (pre) parts.push(pre.textContent);
          });
        } else {
          var titleEl = document.querySelector(".poem-title");
          if (titleEl) parts.push(titleEl.textContent);
          var formatted = document.querySelector(".poem-formatted");
          if (formatted) {
            parts.push(formatted.textContent);
          } else {
            var lines = document.querySelectorAll(".poem-line");
            lines.forEach(function (el) {
              parts.push(el.textContent);
            });
          }
        }
        var text = parts.join("\n");
        if (!text) return;
        navigator.clipboard.writeText(text).then(function () {
          var btn = document.getElementById("btn-copy");
          btn.textContent = "\u2714";
          setTimeout(function () {
            btn.textContent = "\uD83D\uDCCB";
          }, 1500);
        });
      }
