    "openai==2.48.0",
    "packaging==26.2",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "proxy_tools==0.1.0",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "Pygments==2.20.0",
    "pypinyin==0.55.0",
    "python-engineio==4.13.3",
    "python-socketio==5.16.3",
    "pythonnet==3.1.0",
    "pywebview==6.2.1",
