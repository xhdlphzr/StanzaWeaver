# StanzaWeaver — Neuro-Symbolic Poetry Generation App
#
# 依赖管理使用 uv：
#   uv sync                # 安装运行依赖 + dev 依赖（按 uv.lock，等价旧 pip install -r requirements.txt + dev 工具）
#   uv sync --no-dev       # 仅运行依赖（Web/容器部署用，dev 不进镜像）
#   uv run pytest / ruff check ./ / mypy --strict ./ / ruff format .
#
# 本项目是纯应用（不可作为库导入打包），故 [tool.uv] package = false。

[project]
name = "stanzaweaver"
version = "1.0.0"
description = "Weaving Stanzas with Wisdom — A Neuro-Symbolic Intelligent Poetry Generation Desktop Application"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["poetry", "meter", "neuro-symbolic", "llm", "flask"]
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "ast_serialize==0.8.0",
    "bidict==0.23.1",
    "blinker==1.9.0",
    "bottle==0.13.4",
    "certifi==2026.7.22",
    "cffi==2.1.0",
    "charset-normalizer==3.5.1",
    "click==8.4.2",
    "clr_loader==0.3.1",
    "colorama==0.4.6",
    "defusedxml==0.7.1",
    "distro==1.9.0",
    "filelock==3.32.2",
    "Flask==3.1.3",
    "Flask-SocketIO==5.6.1",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.5.2",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface_hub==1.25.1",
    "idna==3.18",
    "iniconfig==2.3.0",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "jiter==0.16.0",
    "joblib==1.5.3",
    "librt==0.15.0",
    "markdown-it-py==4.2.0",
    "MarkupSafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "narwhals==2.24.0",
    "networkx==3.6.1",
