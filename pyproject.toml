[project]
name = "stanza-weaver"
version = "0.1.0"
description = "Neuro-Symbolic Intelligent Poetry Generation"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "pywebview>=5.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "pypinyin>=0.51",
    "nltk>=3.9",
    "cltk>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stanza_weaver"]
